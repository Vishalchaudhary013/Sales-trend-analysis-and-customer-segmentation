[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "D"]
ignore = ["D203", "D213", "D100", "D104", "D413"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"pages/*" = ["N999"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
